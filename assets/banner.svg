<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">DMSK971 — IA et automatisation</title>
  <desc id="desc">Bannière minimaliste violet PULSE : DMSK971, intelligence artificielle, automatisation et développement, avec un monogramme D orbital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100B25"/>
      <stop offset="1" stop-color="#211443"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5A0FF"/>
      <stop offset="1" stop-color="#6930DB"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1020" cy="150" r="160" fill="#6930DB" opacity="0.05"/>
    <path d="M 52 53 H 102" stroke="#B5A0FF" stroke-width="5" stroke-linecap="round"/>
    <text x="52" y="158" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" letter-spacing="4" fill="#F5F3FF">DMSK971</text>
    <text x="54" y="211" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#B5A0FF">AI  /  AUTOMATISATION  /  DÉVELOPPEMENT</text>
    <text x="54" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1" fill="#DDD6FE">Construire utile. Faire simple.</text>
    <circle cx="994" cy="159" r="108" fill="#100B25" stroke="url(#purple)" stroke-width="3"/>
    <text x="993" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="155" font-weight="700" fill="#F5F3FF">D</text>
    <g transform="rotate(-20 994 159)">
      <ellipse cx="994" cy="159" rx="117" ry="26" fill="none" stroke="url(#purple)" stroke-width="7"/>
    </g>
    <circle cx="886" cy="194" r="5" fill="#B5A0FF"/>
  </g>
</svg>
